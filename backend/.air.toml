root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  entrypoint = ["./tmp/api"]
  delay = 500
  exclude_dir = ["tmp", "bin"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "sql"]
  kill_delay = "5s"
  send_interrupt = true
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
