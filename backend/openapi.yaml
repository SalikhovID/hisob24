          $ref: "#/components/responses/CompanyRequired"
        "404":
          $ref: "#/components/responses/CustomerNotFound"
    put:
      operationId: updateCustomer
      summary: Mijozni tahrirlash
      description: >
        Telefon va javoblar yuborilganiga almashadi: yuborilmagan maydonning
        javobi o'chadi. Mijozning turi o'zgarmaydi. Har a'zo tahrirlay oladi;
        ikki kishi bir vaqtda tahrirlasa, oxirgi saqlagan qoladi. Tekshiruv
        qo'shishdagidek; mijoz allaqachon tanlagan nofaol variant saqlanadi.
        O'zgargan har maydon tarixga yoziladi; hech narsa o'zgarmasa, hech
        narsa yozilmaydi.
      security:
        - appBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: Saqlangan mijoz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/SubscriptionExpired"
        "403":
          $ref: "#/components/responses/CompanyRequired"
        "404":
          $ref: "#/components/responses/CustomerNotFound"
        "409":
          $ref: "#/components/responses/CustomerTaken"
    delete:
      operationId: deleteCustomer
      summary: Mijozni o'chirish
      description: >
        Mijoz yashiriladi: ro'yxatda va qidiruvda ko'rinmaydi, sahifasi 404
        beradi, raqami bo'shaydi. Bazadan o'chmaydi; tiklash yo'q. Har a'zo
        o'chira oladi. Faol vazifasi bor mijoz o'chirilmaydi (409
        customer_in_use). O'chirish tarixga yoziladi.
      security:
        - appBearer: []
      responses:
        "204":
          description: O'chirildi
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/SubscriptionExpired"
        "403":
          $ref: "#/components/responses/CompanyRequired"
        "404":
          $ref: "#/components/responses/CustomerNotFound"
        "409":
          $ref: "#/components/responses/CustomerInUse"
