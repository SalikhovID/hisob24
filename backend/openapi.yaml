    put:
      operationId: updateTask
      summary: Vazifani tahrirlash
      description: >
        Nomi, muddati, bosqichi, mas'uli va javoblari to'liq qayta yoziladi;
        turi va mijozi o'zgarmaydi. Har a'zo tahrirlaydi. Tekshiruv
        qo'shishdagi kabi. Berilmagan maydon javobi o'chadi. Vazifadagi
        chiqarilgan mas'ul o'zgartirilmasa qoladi; boshqasi a'zo bo'lishi
        kerak. O'zgargan maydonlar tarixga yoziladi; o'zgarishsiz saqlash
        yozilmaydi.
      security:
        - appBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Saqlangan vazifa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/SubscriptionExpired"
        "403":
          $ref: "#/components/responses/CompanyRequired"
        "404":
          $ref: "#/components/responses/TaskNotFound"
    delete:
      operationId: deleteTask
      summary: Vazifani o'chirish
      description: >
        Vazifa yashiriladi: ro'yxatda, kanbanda va mijoz sahifasida
        ko'rinmaydi, sahifasi 404 beradi. Bazadan o'chmaydi; tiklash yo'q.
        Har a'zo o'chira oladi. O'chirish tarixga yoziladi.
      security:
        - appBearer: []
      responses:
        "204":
          description: O'chirildi
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/SubscriptionExpired"
        "403":
          $ref: "#/components/responses/CompanyRequired"
        "404":
          $ref: "#/components/responses/TaskNotFound"
  /app/tasks/{id}/stage:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    patch:
      operationId: moveTask
      summary: Vazifani boshqa bosqichga o'tkazish
      description: >
        Kanbanda sudrab yoki menyudan ko'chirish: faqat bosqich o'zgaradi.
        Har a'zo ko'chiradi. O'sha bosqichning o'zi hech narsani
        o'zgartirmaydi va tarixga yozilmaydi; boshqasi "Bosqich" o'zgarishi
        sifatida yoziladi.
      security:
        - appBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskMove"
      responses:
        "200":
          description: Ko'chirilgan vazifa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/SubscriptionExpired"
        "403":
          $ref: "#/components/responses/CompanyRequired"
        "404":
          $ref: "#/components/responses/TaskNotFound"
  /app/tasks/{id}/history:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: listTaskHistory
      summary: Vazifaning o'zgarishlar tarixi (tasks.history ruxsati)
      description: >
        Vazifa bilan nima bo'lgani, oxirgisi birinchi: qo'shilgani, har
        tahriri va ko'chirilgani (o'chirilgan vazifa 404 beradi). O'zgargan
        har maydon eski va yangi qiymati bilan, o'sha paytdagi nomlarda matn
        sifatida: avval vazifaning o'z maydonlari (Nomi, Muddat dd.mm.yyyy,
        Bosqich, Mas'ul), keyin turning maydonlari.
      security:
        - appBearer: []
      responses:
        "200":
          description: Tarix yozuvlari
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskHistoryEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/SubscriptionExpired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/TaskNotFound"
components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: admin_session
    appBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "HS256, aud: app, sub: telefon, company_id va role (tanlangan bo'lsa)"
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
  parameters:
    TelegramSecret:
      name: X-Telegram-Bot-Api-Secret-Token
      in: header
      required: true
      schema:
        type: string
    CompanyID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    BadRequest:
      description: >
        So'rov noto'g'ri (bad_request) yoki maydon xato (validation_error,
        message aniq sababni aytadi)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: >
        Sessiya yo'q yoki tugagan (unauthorized). /app ostida shuningdek: user
        access token'dagi kompaniyaga endi a'zo emas; client refresh qilib,
        company'siz token oladi
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Juda ko'p so'rov (too_many_requests)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SubscriptionExpired:
      description: Company muddati o'tgan yoki bloklangan (subscription_expired)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    EmployeeNotFound:
      description: Bunday raqam shu kompaniyaning a'zosi emas (not_found)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CannotChangeOwner:
      description: >
        Kompaniya owner'ini user app'dan o'zgartirib yoki o'chirib bo'lmaydi
        (cannot_change_owner); buni admin panel qiladi
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AlreadyMember:
      description: >
        Raqam shu kompaniyaning a'zosi, owner yoki xodim (already_member). Hech
        narsa o'zgarmaydi
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OwnerOnly:
      description: >
        Amal faqat tanlangan kompaniyaning owner'i uchun (owner_only), rollarni
        boshqarish va biriktirish kabi: so'rov user rolida yoki kompaniya
        tanlanmagan token bilan kelgan
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SessionEnded:
      description: >
        Refresh token yo'q yoki yaroqsiz (invalid_refresh_token, cookie
        o'chiriladi) yoki access token yo'q (unauthorized)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SignedIn:
      description: Kirildi; refresh token Set-Cookie refresh_token'da
      headers:
        Set-Cookie:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Tokens"
    InvalidSecretToken:
      description: Webhook secret noto'g'ri (invalid_secret_token)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Kompaniya topilmadi (not_found)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CompanyRequired:
      description: Sessiya hali kompaniya tanlamagan (company_required)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >
        Sessiya hali kompaniya tanlamagan (company_required) yoki a'zoning
        ruxsati bu amalni qamrab olmaydi (forbidden). Egasi hammasini qila
        oladi; rolsiz xodim standart ruxsatga ega (mijozlar va vazifalar,
        tarixsiz); rolli xodim faqat rolidagi ruxsatlarga (logic/roles.md,
        4-bo'lim)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RoleNotFound:
      description: Kompaniyada bunday rol yo'q (not_found, "Rol topilmadi")
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RoleOrEmployeeNotFound:
      description: >
        Xodim kompaniya a'zosi emas ("Xodim topilmadi") yoki rol
        kompaniyaniki emas ("Rol topilmadi") (not_found)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RoleConflict:
      description: >
        Bu nomli rol allaqachon bor (name_taken) yoki rol xodimlarga
        biriktirilgan va o'chirilmaydi (role_in_use, "Bu rol N ta xodimga
        biriktirilgan")
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CustomerSettingNotFound:
      description: Tur, maydon, dropdown yoki variant topilmadi (not_found)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CustomerSettingConflict:
      description: >
        Nom band (name_taken); narsa ishlatilmoqda (dropdown_in_use: mijoz
        yoki vazifa maydoni ulangan, type_in_use, field_in_use,
        option_in_use); maydonda takror qiymatlar bor (duplicates_exist);
        ro'yxat boshqa joyda o'zgargan (order_changed)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CustomerTaken:
      description: >
        Telefon boshqa mijozda bor (phone_taken) yoki takrorlanmas maydondagi
        javob boshqa mijozda bor (value_taken); customer_id o'sha mijoz
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CustomerTakenError"
    CustomerNotFound:
      description: Mijoz topilmadi (not_found)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TaskSettingNotFound:
      description: Bosqich, tur yoki maydon topilmadi (not_found)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TaskSettingConflict:
      description: >
        Nom band (name_taken); narsa ishlatilmoqda (stage_in_use,
        type_in_use, field_in_use); ro'yxat boshqa joyda o'zgargan
        (order_changed)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CustomerInUse:
      description: Mijozda faol vazifa bor (customer_in_use)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TaskNotFound:
      description: Vazifa topilmadi (not_found)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    TelegramLogin:
      type: object
      required: [initData]
      properties:
        initData:
          type: string
          description: window.Telegram.WebApp.initData
    TelegramUpdate:
      type: object
      description: Telegram Bot API Update obyekti (https://core.telegram.org/bots/api#update)
      additionalProperties: true
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: snake_case xato kodi
        message:
          type: string
          description: O'zbekcha matn
    Admin:
      type: object
      required: [telegram_id, full_name]
      properties:
        telegram_id:
          type: integer
          format: int64
        full_name:
          type: [string, "null"]
    Company:
      type: object
      required: [id, name, end_date, is_active, days_left, created_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        end_date:
          type: string
          format: date
        is_active:
          type: boolean
        days_left:
          type: integer
          description: >
            end_date - bugun (baza sanasi). Muddati o'tgan bo'lsa manfiy.
            Bloklangan kompaniyada ham to'langan kunlarni ko'rsatadi.
        created_at:
          type: string
          format: date-time
    CompanyDetail:
      allOf:
        - $ref: "#/components/schemas/Company"
        - type: object
          required: [users]
          properties:
            users:
              type: array
              items:
                $ref: "#/components/schemas/Member"
    CompanyPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Company"
        total:
          type: integer
          format: int64
        page:
          type: integer
        page_size:
          type: integer
    Location:
      type: object
      description: Kompaniyaning lokatsiyasi (filiali), logic/locations.md
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    Member:
      type: object
      required: [phone, full_name, role, role_id, role_name, locations, created_at]
      properties:
        phone:
          type: string
          description: 998XXXXXXXXX ko'rinishida
        full_name:
          type: [string, "null"]
          description: Shu kompaniyadagi ismi
        role:
          $ref: "#/components/schemas/Role"
        role_id:
          type: [integer, "null"]
          format: int64
          description: >
            A'zo egallagan kompaniya roli; egasida va rolsiz xodimda null
            (standart ruxsat)
        role_name:
          type: [string, "null"]
          description: Shu rolning nomi, rol bo'lmasa null
        locations:
          type: [array, "null"]
          description: >
            A'zo ishlay oladigan lokatsiyalar (logic/locations.md, 5-bo'lim):
            hammasi bo'lsa null (egasida har doim), cheklangan bo'lsa
            cheklovdagi jonli lokatsiyalar (hammasi o'chirilgan bo'lsa bo'sh
            ro'yxat)
          items:
            $ref: "#/components/schemas/Location"
        created_at:
          type: string
          format: date-time
    Role:
      type: string
      description: >
        A'zolik roli. owner: kompaniyaning yagona egasi, uni admin panel
        qo'yadi, hamma narsani qila oladi. user: user app'dan qo'shilgan xodim;
        ruxsati egallagan kompaniya roli (role_id) bo'yicha, rolsiz bo'lsa
        standart (mijozlar va vazifalar, tarixsiz).
      enum: [owner, user]
    Permission:
      type: string
      description: >
        Kompaniya roli tarkibidagi bitta ruxsat, "bo'lim.amal" ko'rinishida
        (logic/roles.md, 4-bo'lim). Bo'limlar: customers (mijozlar), tasks
        (vazifalar), employees (xodimlar), settings (sozlamalar: turlar,
        maydonlar, dropdownlar, bosqichlar). Amallar: view (bo'limni ko'rish,
        ro'yxat va sahifalar), create (qo'shish), edit (tahrirlash, tartib,
        vazifa bosqichini o'zgartirish), delete (o'chirish), history
        (o'zgarishlar tarixi; faqat mijozlar va vazifalarda). Amal bo'limning
        view ruxsatisiz qabul qilinmaydi.
      enum:
        - customers.view
        - customers.create
        - customers.edit
        - customers.delete
        - customers.history
        - tasks.view
        - tasks.create
        - tasks.edit
        - tasks.delete
        - tasks.history
        - employees.view
        - employees.create
        - employees.edit
        - employees.delete
        - settings.view
        - settings.create
        - settings.edit
        - settings.delete
    Billing:
      type: object
      required: [id, company_id, days, amount, prev_end_date, new_end_date, note, created_by, created_at]
      properties:
        id:
          type: integer
          format: int64
        company_id:
          type: integer
          format: int64
        days:
          type: integer
        amount:
          type: [string, "null"]
          description: Bazadagidek ikki kasr xonasi bilan, masalan "150000.50"
        prev_end_date:
          type: string
          format: date
        new_end_date:
          type: string
          format: date
        note:
          type: [string, "null"]
        created_by:
          type: [integer, "null"]
          format: int64
        created_at:
          type: string
          format: date-time
    AdminAccount:
      type: object
      required: [telegram_id, full_name, is_active, created_at]
      properties:
        telegram_id:
          type: integer
          format: int64
        full_name:
          type: [string, "null"]
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
    CreateCompany:
      type: object
      required: [name, end_date, owner_phone, owner_full_name]
      properties:
        name:
          type: string
          minLength: 1
        end_date:
          type: string
          format: date
        owner_phone:
          type: string
          description: "+998 90 123 45 67, 998901234567 yoki 901234567"
        owner_full_name:
          type: string
          minLength: 1
    PatchCompany:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        is_active:
          type: boolean
    MemberInput:
      type: object
      required: [phone, full_name]
      properties:
        phone:
          type: string
          description: "+998 90 123 45 67, 998901234567 yoki 901234567"
        full_name:
          type: string
          minLength: 1
          description: Shu kompaniyadagi ismi
    RenameMember:
      type: object
      required: [full_name]
      properties:
        full_name:
          type: string
          minLength: 1
          description: Shu kompaniyadagi yangi ismi
    CreateBilling:
      type: object
      required: [days]
      properties:
        days:
          type: integer
          minimum: 1
          maximum: 3650
        amount:
          type: string
          pattern: "^[0-9]{1,12}([.][0-9]{1,2})?$"
        note:
          type: string
    AddAdmin:
      type: object
      required: [telegram_id, full_name]
      properties:
        telegram_id:
          type: integer
          format: int64
          minimum: 1
        full_name:
          type: string
          minLength: 1
    CodeSent:
      type: object
      required: [retry_after]
      properties:
        retry_after:
          type: integer
          description: Keyingi kodni necha soniyadan keyin so'rash mumkin
    Tokens:
      type: object
      required: [access_token, expires_in, company_id]
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          description: Soniyalarda (900)
        company_id:
          type: [integer, "null"]
          format: int64
          description: Tanlanmagan bo'lsa null (frontend /select-company'ga o'tadi)
    AppUser:
      type: object
      required: [phone, full_name]
      properties:
        phone:
          type: string
        full_name:
          type: [string, "null"]
          description: >
            Tanlangan kompaniyadagi ismi. Kompaniya tanlanmagan yoki a'zolikda
            ism bo'lmasa, userning o'z ismi.
    CompanyRole:
      type: object
      required: [id, name, permissions, members_count]
      description: >
        Kompaniya roli: egasi tuzgan nom va ruxsatlar to'plami, xodimga
        biriktiriladi (logic/roles.md, 5-bo'lim)
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        permissions:
          type: array
          description: Katalog tartibida, har biri bir marta
          items:
            $ref: "#/components/schemas/Permission"
        members_count:
          type: integer
          format: int64
          description: Shu rolni egallagan xodimlar soni
    RoleInput:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
          maxLength: 60
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
    EmployeeRoleInput:
      type: object
      required: [role_id]
      properties:
        role_id:
          type: [integer, "null"]
          format: int64
          description: Shu kompaniyaning roli; null rolni olib tashlaydi
    AppCompany:
      type: object
      required: [id, name, role, role_name, end_date, days_left, is_active]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        role_name:
          type: [string, "null"]
          description: >
            User shu kompaniyada egallagan kompaniya rolining nomi; egasida va
            rolsiz xodimda null
        end_date:
          type: string
          format: date
        days_left:
          type: integer
          description: >
            end_date - bugun (baza sanasi). Muddati o'tgan bo'lsa manfiy:
            bunday company bilan so'rovlar 402 oladi.
        is_active:
          type: boolean
    Me:
      type: object
      required: [user, company, companies, permissions, locations]
      properties:
        user:
          $ref: "#/components/schemas/AppUser"
        company:
          oneOf:
            - $ref: "#/components/schemas/AppCompany"
            - type: "null"
        companies:
          type: array
          items:
            $ref: "#/components/schemas/AppCompany"
        permissions:
          type: array
          description: >
            Tanlangan kompaniyada user hozir nima qila olishi, katalog
            tartibida: egasida hammasi, rolsiz xodimda standart to'plam, rolli
            xodimda rolniki. Kompaniya tanlanmagan bo'lsa bo'sh. Interfeys
            bo'limlar va tugmalarni shundan quradi; API har so'rovda o'zi
            tekshiradi.
          items:
            $ref: "#/components/schemas/Permission"
        locations:
          type: array
          description: >
            Tanlangan kompaniyada user ishlay oladigan jonli lokatsiyalar,
            qo'shilish tartibida (logic/locations.md, 4-bo'lim): egasida va
            cheklanmagan xodimda kompaniyaning hammasi, cheklanganda
            cheklovdagilar. Kompaniya tanlanmagan bo'lsa bo'sh. Tepadagi
            tanlovchi shundan quriladi; 2+ bo'lsa ko'rinadi.
          items:
            $ref: "#/components/schemas/Location"
    CustomerOption:
      type: object
      required: [id, label, is_active]
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
        is_active:
          type: boolean
          description: >
            Nofaol variant yangi tanlovlarda chiqmaydi, uni tanlagan
            mijozlarda qoladi
    CustomerDropdown:
      type: object
      required: [id, name, options]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        options:
          type: array
          description: Variantlar o'z tartibida
          items:
            $ref: "#/components/schemas/CustomerOption"
    CustomerFieldKind:
      type: string
      description: >
        string: matn; int: butun son; dropdown va radio: variantlardan
        bittasi; multi_dropdown va checkbox: variantlardan bir nechtasi
      enum: [string, int, dropdown, multi_dropdown, radio, checkbox]
    CustomerField:
      type: object
      required: [id, label, kind, required, is_unique, dropdown_id]
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
        kind:
          $ref: "#/components/schemas/CustomerFieldKind"
        required:
          type: boolean
        is_unique:
          type: boolean
          description: Faol mijozlar ichida qiymat takrorlanmaydi (faqat matn va son)
        dropdown_id:
          type: [integer, "null"]
          format: int64
          description: Tanlov turlarida variantlar olinadigan dropdown
