  /app/tasks:
    get:
      operationId: listTasks
      summary: Vazifalar ro'yxati
      description: >
        Access token'dagi kompaniyaning vazifalari, muddati yaqini birinchi
        (bir kunlilar qo'shilgan tartibda), sahifada 20 ta. Har a'zo o'qiydi.
        O'chirilgan vazifalar chiqmaydi. Filtrlar birga ishlaydi.
      security:
        - appBearer: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: >
            Nomida, vazifaning matn javoblarida va mijozning matn
            javoblarida qidiriladi (katta-kichik harf farqsiz, harfma-harf).
            Faqat raqamlardan iborat qidiruv mijoz telefonida va vazifaning
            butun son javoblarida ham qidiriladi.
        - name: type_id
          in: query
          schema:
            type: integer
            format: int64
          description: Faqat shu turdagi vazifalar
        - name: stage_id
          in: query
          schema:
            type: integer
            format: int64
          description: Faqat shu bosqichdagi vazifalar (kanban ustuni)
        - name: assignee
          in: query
          schema:
            type: string
          description: Faqat shu a'zoga biriktirilgan vazifalar (telefon)
        - name: customer_id
          in: query
          schema:
            type: integer
            format: int64
          description: Faqat shu mijozning vazifalari (mijoz sahifasi)
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: Vazifalar sahifasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/SubscriptionExpired"
        "403":
          $ref: "#/components/responses/CompanyRequired"
    post:
      operationId: createTask
      summary: Vazifa qo'shish
      description: >
        Access token'dagi kompaniyaga vazifa qo'shadi; har a'zo qo'sha oladi.
        Nomi, muddati (YYYY-MM-DD, o'tgan sana ham bo'ladi), lokatsiyasi
        (location_id, kompaniyaning jonli lokatsiyasi), turi, bosqichi va
        mijozi majburiy, mas'ul ixtiyoriy (kompaniya a'zosi). values turning
        maydonlariga javoblar. customer yo mavjud mijoz ({id}: kompaniyaniki,
        faol) yo yangi mijoz ({type_id, phone, values}: mijoz qoidalari
        bilan, vazifa bilan bitta tranzaksiyada yoziladi). Tekshiruv tartibi:
        nom, muddat, lokatsiya, tur, bosqich, mas'ul, maydonlar, mijoz;
        birinchi xato qaytadi (400 validation_error). Yangi mijozning takror telefoni
        (phone_taken) va takrorlanmas maydondagi takror javobi (value_taken)
        409 qaytaradi, javobda o'sha mijozning ID'si bilan; vazifa ham,
        mijoz ham yozilmaydi. Kim qo'shgani saqlanadi.
      security:
        - appBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "201":
          description: Qo'shilgan vazifa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/SubscriptionExpired"
        "403":
          $ref: "#/components/responses/CompanyRequired"
        "409":
          $ref: "#/components/responses/CustomerTaken"
