openapi: 3.1.0
info:
  title: Hisob24 API
  version: 0.1.0
  description: >
    Asosiy API kontrakti. Frontend uchun TS client shu fayldan generatsiya
    qilinadi (packages/api-client). Brauzer API'ga Next.js rewrites orqali
    /api prefiksi bilan murojaat qiladi. Boshqa saytdan kelgan o'zgartiruvchi
    so'rov (POST, PATCH, DELETE; Sec-Fetch-Site yoki Origin bo'yicha) 403
    forbidden oladi.
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness tekshiruvi
      responses:
        "200":
          description: API ishlayapti
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /admin/auth/otp:
    post:
      operationId: adminLoginWithCode
      summary: Admin botdan olingan kod bilan kirish
      description: >
        Kod 60 soniya amal qiladi va bir marta ishlaydi. Bitta IP'dan
        daqiqasiga 5 ta urinish. Muvaffaqiyatda 12 soatlik admin_session
        cookie (httpOnly, SameSite=Lax) qo'yiladi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
      responses:
        "200":
          description: Sessiya ochildi
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Kod noto'g'ri yoki muddati o'tgan (invalid_code)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Juda ko'p urinish (too_many_requests)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/auth/telegram:
    post:
      operationId: adminLoginWithInitData
      summary: Telegram Mini App initData bilan kirish
      description: >
        initData admin bot tokeni bilan imzolangan va 24 soatdan eski
        bo'lmasligi kerak. Sessiya cookie'si SameSite=None; Secure;
        Partitioned: Telegram Web Mini App'ni boshqa sayt ichida (iframe)
        ochadi. COOKIE_SECURE=false bo'lsa (lokal http) SameSite=Lax.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [initData]
              properties:
                initData:
                  type: string
      responses:
        "200":
          description: Sessiya ochildi
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: initData tasdiqlanmadi (invalid_init_data)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Telegram foydalanuvchisi admin emas (not_admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/auth/logout:
    post:
      operationId: adminLogout
      summary: Sessiyani tugatish
      responses:
        "204":
          description: Sessiya tugadi, cookie o'chirildi
  /admin/me:
    get:
      operationId: getAdminMe
      summary: Joriy admin
      security:
        - adminSession: []
      responses:
        "200":
          description: Joriy admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/companies:
    get:
      operationId: listCompanies
      summary: Kompaniyalar ro'yxati
      description: Eng yangisi birinchi, sahifada 20 ta.
      security:
        - adminSession: []
      parameters:
        - name: search
          in: query
          description: Nom bo'yicha qidiruv (katta-kichik harf farqsiz, harfma-harf)
          schema:
            type: string
        - name: status
          in: query
          description: >
            active: end_date o'tmagan va bloklanmagan; expired: end_date
            o'tgan yoki bloklangan
          schema:
            type: string
            enum: [active, expired]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
      responses:
        "200":
          description: Bitta sahifa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCompany
      summary: Kompaniya va uning egasini yaratish
      description: >
        Bitta tranzaksiyada: kompaniya, egasining user yozuvi (telefon
        allaqachon bo'lsa, mavjud user o'zgarishsiz ishlatiladi) va
        owner a'zoligi.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompany"
      responses:
        "201":
          description: Kompaniya yaratildi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/companies/{id}:
    parameters:
      - $ref: "#/components/parameters/CompanyID"
    get:
      operationId: getCompany
      summary: Kompaniya va uning userlari
      security:
        - adminSession: []
      responses:
        "200":
          description: Kompaniya
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateCompany
      summary: Nomini o'zgartirish yoki bloklash
      description: Berilmagan maydon o'zgarmaydi.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchCompany"
      responses:
        "200":
          description: Yangilangan kompaniya
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/companies/{id}/owner:
    parameters:
      - $ref: "#/components/parameters/CompanyID"
    put:
      operationId: replaceCompanyOwner
      summary: Kompaniya egasini almashtirish
      description: >
        Kiritilgan raqam kompaniyaning owner'i bo'ladi, oldingi owner
        kompaniyada user bo'lib qoladi (bitta transaction). Raqam tizimda
        yo'q bo'lsa, user yaratiladi; kompaniyaning a'zosi bo'lsa, owner'ga
        ko'tariladi. Raqam hozirgi owner'niki bo'lsa, faqat ismi yangilanadi.
        Ism shu kompaniyadagi ism: userning boshqa kompaniyalardagi ismi
        o'zgarmaydi.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "200":
          description: Yangi owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/companies/{id}/billings:
    parameters:
      - $ref: "#/components/parameters/CompanyID"
    get:
      operationId: listBillings
      summary: Billing tarixi
      description: Eng yangisi birinchi.
      security:
        - adminSession: []
      responses:
        "200":
          description: To'lovlar
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Billing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createBilling
      summary: Muddatni uzaytirish
      description: >
        Bitta tranzaksiyada kompaniya qatori bloklanadi va
        new_end_date = GREATEST(end_date, CURRENT_DATE) + days hisoblanadi.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBilling"
      responses:
        "201":
          description: To'lov yozildi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Billing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/admins:
    get:
      operationId: listAdmins
      summary: Adminlar ro'yxati
      description: Nofaollari ham.
      security:
        - adminSession: []
      responses:
        "200":
          description: Adminlar
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: addAdmin
      summary: Admin qo'shish
      description: Nofaol admin qayta faollashadi va ismi yangilanadi.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAdmin"
      responses:
        "201":
          description: Faol admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Bu admin allaqachon faol (admin_exists)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/admins/{telegram_id}:
    delete:
      operationId: deactivateAdmin
      summary: Adminni nofaol qilish
      description: >
        Yozuv o'chirilmaydi, faqat is_active = false bo'ladi va barcha
        sessiyalari o'chiriladi.
      security:
        - adminSession: []
      parameters:
        - name: telegram_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Admin nofaol qilindi
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Faol admin topilmadi (not_found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            O'zini o'chirish (cannot_delete_self) yoki oxirgi faol admin
            (last_admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /app/auth/sms/send:
    post:
      operationId: sendLoginCode
      summary: SMS bilan kirish kodini yuborish
      description: >
        Kod 6 xonali, 2 daqiqa amal qiladi. Tizimga faqat kamida bitta
        kompaniyaga a'zo user kiradi: boshqa raqamga SMS ketmaydi, lekin javob
        bir xil (kim borligi bilinmaydi). Bitta raqamga 60 soniyada bitta kod;
        IP'dan daqiqasiga 5 ta so'rov.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  description: "+998 90 123 45 67, 998901234567 yoki 901234567"
      responses:
        "200":
          description: Qabul qilindi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeSent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /app/auth/sms/verify:
    post:
      operationId: verifyLoginCode
      summary: SMS kod bilan kirish
      description: >
        Access token javobda (15 daqiqa), refresh token httpOnly
        refresh_token cookie'da (30 kun). User bitta company'da bo'lsa u
        tanlanadi, bir nechtasida company_id null. Kodga 5 ta xato urinish,
        IP'dan daqiqasiga 5 ta so'rov.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone:
                  type: string
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Kod noto'g'ri yoki muddati o'tgan (invalid_code)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /app/auth/telegram:
    post:
      operationId: telegramLogin
      summary: User Mini App'dan kodsiz kirish
      description: >
        initData USER_BOT_TOKEN bilan tekshiriladi (24 soat). Telegram akkaunt
        user botga yuborgan raqam kamida bitta kompaniyaga a'zo bo'lsa, SMS
        verify'dagi kabi token beriladi (bitta company bo'lsa tanlanadi). Bu
        sessiyaning
        refresh_token cookie'si Telegram Web iframe'ida ishlashi uchun
        SameSite=None; Secure; Partitioned (COOKIE_SECURE=true bo'lsa).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramLogin"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        "401":
          description: initData yaroqsiz yoki eskirgan (invalid_init_data)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            Raqam botga yuborilmagan (phone_not_shared) yoki raqam hech bir
            kompaniyaga a'zo emas (no_access, message raqamni aytadi)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /app/auth/refresh:
    post:
      operationId: refreshTokens
      summary: Access token'ni yangilash (rotation)
      description: >
        refresh_token cookie'si bekor qilinadi va yangisi beriladi; tanlangan
        company saqlanadi. A'zolik qayta tekshiriladi: user shu company'dan
        chiqarilgan bo'lsa, token company'siz beriladi; hech bir kompaniyaga
        a'zo bo'lmay qolgan bo'lsa, sessiya tugaydi (401).
      security:
        - refreshCookie: []
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        "401":
          $ref: "#/components/responses/SessionEnded"
  /app/auth/logout:
    post:
      operationId: appLogout
      summary: Chiqish
      description: Refresh token bekor qilinadi, cookie o'chiriladi.
      responses:
        "204":
          description: Chiqildi
  /app/auth/switch-company:
    post:
      operationId: switchCompany
      summary: Company tanlash yoki tanlovni bekor qilish
      description: >
        Muddati o'tgan company'ga ham o'tish mumkin (uning sahifalari 402
        qaytaradi). company_id null tanlovni bekor qiladi: muddati o'tgan
        company'dan ro'yxatga qaytish yo'li. Refresh token ham almashadi va
        tanlovni eslab qoladi.
      security:
        - appBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_id]
              properties:
                company_id:
                  type: [integer, "null"]
                  format: int64
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        "401":
          $ref: "#/components/responses/SessionEnded"
        "403":
          description: User bu company'ga a'zo emas (not_member)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /app/me:
    get:
      operationId: getAppMe
      summary: User, tanlangan company va barcha company'lari
      security:
        - appBearer: []
      responses:
        "200":
          description: Joriy user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/SubscriptionExpired"
  /app/employees:
    get:
      operationId: listEmployees
      summary: Kompaniya a'zolari (faqat owner)
      description: >
        Access token'dagi kompaniyaning a'zolari: owner birinchi, keyin
        xodimlar qo'shilgan tartibda. Ism shu kompaniyadagi ism.
      security:
        - appBearer: []
      responses:
        "200":
          description: A'zolar
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/SubscriptionExpired"
        "403":
          $ref: "#/components/responses/OwnerOnly"
    post:
      operationId: addEmployee
      summary: Xodim qo'shish (faqat owner)
      description: >
        Raqam access token'dagi kompaniyaga user rolida qo'shiladi. Tizimda
        yo'q raqamdan user yaratiladi; boshqa kompaniyada bor raqam shu
        kompaniyaga ham a'zo bo'ladi (multi-user). Javob ikkala holatda bir
        xil: kiritilgan ism qaytadi, raqam oldin tizimda bo'lgan-bo'lmagani
        bilinmaydi. Qo'shilgan odamga xabar yuborilmaydi.
      security:
        - appBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "201":
          description: Qo'shilgan xodim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/SubscriptionExpired"
        "403":
          $ref: "#/components/responses/OwnerOnly"
        "409":
          $ref: "#/components/responses/AlreadyMember"
  /app/employees/{phone}:
    parameters:
      - name: phone
        in: path
        required: true
        description: Xodimning telefoni, 998901234567 ko'rinishida
        schema:
          type: string
    patch:
      operationId: renameEmployee
      summary: Xodim ismini o'zgartirish (faqat owner)
      description: >
        Xodimning shu kompaniyadagi ismi o'zgaradi; boshqa kompaniyalardagi
        ismi o'zgarmaydi. Owner'ning ismi bu yerdan o'zgarmaydi.
      security:
        - appBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameMember"
      responses:
        "200":
          description: Yangi ismli xodim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/SubscriptionExpired"
        "403":
          $ref: "#/components/responses/OwnerOnly"
        "404":
          $ref: "#/components/responses/EmployeeNotFound"
        "409":
          $ref: "#/components/responses/CannotChangeOwner"
    delete:
      operationId: removeEmployee
      summary: Xodimni kompaniyadan chiqarish (faqat owner)
      description: >
        Xodimning shu kompaniyadagi a'zoligi o'chadi va u keyingi so'rovdayoq
        bu kompaniyaga kira olmaydi. User yozuvi va boshqa kompaniyalardagi
        a'zoliklari qoladi; boshqa kompaniyasi qolmasa, tizimga kira olmaydi.
        Keyin qayta qo'shish mumkin.
      security:
        - appBearer: []
      responses:
        "204":
          description: Xodim chiqarildi
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/SubscriptionExpired"
        "403":
          $ref: "#/components/responses/OwnerOnly"
        "404":
          $ref: "#/components/responses/EmployeeNotFound"
        "409":
          $ref: "#/components/responses/CannotChangeOwner"
  /app/customer-dropdowns:
    get:
      operationId: listCustomerDropdowns
      summary: Dropdownlar, variantlari bilan
      description: >
        Access token'dagi kompaniyaning dropdownlari yaratilgan tartibda, har
        biri variantlari bilan (o'z tartibida, nofaollari ham). Har a'zo
        o'qiydi: mijoz formasi va ro'yxati shundan quriladi.
      security:
        - appBearer: []
      responses:
        "200":
          description: Dropdownlar
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerDropdown"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/SubscriptionExpired"
        "403":
          $ref: "#/components/responses/CompanyRequired"
    post:
      operationId: createCustomerDropdown
      summary: Dropdown yaratish (faqat owner)
      description: >
        Variantsiz yangi dropdown. Nomi kompaniyada takrorlanmaydi
        (katta-kichik harf farqsiz), 60 belgigacha.
      security:
        - appBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameInput"
      responses:
        "201":
          description: Yaratilgan dropdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDropdown"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/SubscriptionExpired"
        "403":
          $ref: "#/components/responses/OwnerOnly"
        "409":
          $ref: "#/components/responses/CustomerSettingConflict"
  /app/customer-types:
    get:
      operationId: listCustomerTypes
      summary: Mijoz turlari, maydonlari bilan
      description: >
        Access token'dagi kompaniyaning mijoz turlari o'z tartibida, har biri
        maydonlari bilan. Har a'zo o'qiydi: mijoz formasi va ro'yxat ustunlari
        shundan quriladi. Telefon maydon emas: u har mijozda bor.
      security:
        - appBearer: []
      responses:
        "200":
          description: Turlar
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/SubscriptionExpired"
        "403":
          $ref: "#/components/responses/CompanyRequired"
  /app/customer-dropdowns/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    patch:
      operationId: renameCustomerDropdown
      summary: Dropdown nomini o'zgartirish (faqat owner)
      security:
        - appBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameInput"
      responses:
        "200":
          description: Yangi nomli dropdown, variantlari bilan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDropdown"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/SubscriptionExpired"
        "403":
          $ref: "#/components/responses/OwnerOnly"
        "404":
          $ref: "#/components/responses/CustomerSettingNotFound"
        "409":
          $ref: "#/components/responses/CustomerSettingConflict"
  /webhooks/admin-bot:
    post:
      operationId: adminBotWebhook
      summary: Admin botning Telegram update'lari (faqat BOT_MODE=webhook)
      description: >
        Telegram update'larni shu manzilga yuboradi: API ishga tushganda
        setWebhook bilan PUBLIC_API_URL + /webhooks/admin-bot o'rnatiladi.
        X-Telegram-Bot-Api-Secret-Token TELEGRAM_WEBHOOK_SECRET bilan
        solishtiriladi. Frontend uchun emas.
      parameters:
        - $ref: "#/components/parameters/TelegramSecret"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramUpdate"
      responses:
        "200":
          description: Update qabul qilindi
        "401":
          $ref: "#/components/responses/InvalidSecretToken"
  /webhooks/user-bot:
    post:
      operationId: userBotWebhook
      summary: User botning Telegram update'lari (faqat BOT_MODE=webhook)
      description: >
        Telegram update'larni shu manzilga yuboradi: API ishga tushganda
        setWebhook bilan PUBLIC_API_URL + /webhooks/user-bot o'rnatiladi.
        X-Telegram-Bot-Api-Secret-Token TELEGRAM_WEBHOOK_SECRET bilan
        solishtiriladi. Frontend uchun emas.
      parameters:
        - $ref: "#/components/parameters/TelegramSecret"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramUpdate"
      responses:
        "200":
          description: Update qabul qilindi
        "401":
          $ref: "#/components/responses/InvalidSecretToken"
components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: admin_session
    appBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "HS256, aud: app, sub: telefon, company_id va role (tanlangan bo'lsa)"
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
  parameters:
    TelegramSecret:
      name: X-Telegram-Bot-Api-Secret-Token
      in: header
      required: true
      schema:
        type: string
    CompanyID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    BadRequest:
      description: >
        So'rov noto'g'ri (bad_request) yoki maydon xato (validation_error,
        message aniq sababni aytadi)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: >
        Sessiya yo'q yoki tugagan (unauthorized). /app ostida shuningdek: user
        access token'dagi kompaniyaga endi a'zo emas; client refresh qilib,
        company'siz token oladi
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Juda ko'p so'rov (too_many_requests)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SubscriptionExpired:
      description: Company muddati o'tgan yoki bloklangan (subscription_expired)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    EmployeeNotFound:
      description: Bunday raqam shu kompaniyaning a'zosi emas (not_found)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CannotChangeOwner:
      description: >
        Kompaniya owner'ini user app'dan o'zgartirib yoki o'chirib bo'lmaydi
        (cannot_change_owner); buni admin panel qiladi
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AlreadyMember:
      description: >
        Raqam shu kompaniyaning a'zosi, owner yoki xodim (already_member). Hech
        narsa o'zgarmaydi
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OwnerOnly:
      description: >
        Amal faqat tanlangan kompaniyaning owner'i uchun (owner_only): so'rov
        user rolida yoki kompaniya tanlanmagan token bilan kelgan
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SessionEnded:
      description: >
        Refresh token yo'q yoki yaroqsiz (invalid_refresh_token, cookie
        o'chiriladi) yoki access token yo'q (unauthorized)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SignedIn:
      description: Kirildi; refresh token Set-Cookie refresh_token'da
      headers:
        Set-Cookie:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Tokens"
    InvalidSecretToken:
      description: Webhook secret noto'g'ri (invalid_secret_token)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Kompaniya topilmadi (not_found)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CompanyRequired:
      description: Sessiya hali kompaniya tanlamagan (company_required)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CustomerSettingNotFound:
      description: Tur, maydon, dropdown yoki variant topilmadi (not_found)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CustomerSettingConflict:
      description: >
        Nom band (name_taken); narsa ishlatilmoqda (dropdown_in_use,
        type_in_use, field_in_use, option_in_use); maydonda takror qiymatlar
        bor (duplicates_exist); ro'yxat boshqa joyda o'zgargan (order_changed)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    TelegramLogin:
      type: object
      required: [initData]
      properties:
        initData:
          type: string
          description: window.Telegram.WebApp.initData
    TelegramUpdate:
      type: object
      description: Telegram Bot API Update obyekti (https://core.telegram.org/bots/api#update)
      additionalProperties: true
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: snake_case xato kodi
        message:
          type: string
          description: O'zbekcha matn
    Admin:
      type: object
      required: [telegram_id, full_name]
      properties:
        telegram_id:
          type: integer
          format: int64
        full_name:
          type: [string, "null"]
    Company:
      type: object
      required: [id, name, end_date, is_active, days_left, created_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        end_date:
          type: string
          format: date
        is_active:
          type: boolean
        days_left:
          type: integer
          description: >
            end_date - bugun (baza sanasi). Muddati o'tgan bo'lsa manfiy.
            Bloklangan kompaniyada ham to'langan kunlarni ko'rsatadi.
        created_at:
          type: string
          format: date-time
    CompanyDetail:
      allOf:
        - $ref: "#/components/schemas/Company"
        - type: object
          required: [users]
          properties:
            users:
              type: array
              items:
                $ref: "#/components/schemas/Member"
    CompanyPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Company"
        total:
          type: integer
          format: int64
        page:
          type: integer
        page_size:
          type: integer
    Member:
      type: object
      required: [phone, full_name, role, created_at]
      properties:
        phone:
          type: string
          description: 998XXXXXXXXX ko'rinishida
        full_name:
          type: [string, "null"]
          description: Shu kompaniyadagi ismi
        role:
          $ref: "#/components/schemas/Role"
        created_at:
          type: string
          format: date-time
    Role:
      type: string
      description: >
        owner: kompaniyaning yagona egasi, uni admin panel qo'yadi. user:
        owner user app'dan qo'shgan xodim.
      enum: [owner, user]
    Billing:
      type: object
      required: [id, company_id, days, amount, prev_end_date, new_end_date, note, created_by, created_at]
      properties:
        id:
          type: integer
          format: int64
        company_id:
          type: integer
          format: int64
        days:
          type: integer
        amount:
          type: [string, "null"]
          description: Bazadagidek ikki kasr xonasi bilan, masalan "150000.50"
        prev_end_date:
          type: string
          format: date
        new_end_date:
          type: string
          format: date
        note:
          type: [string, "null"]
        created_by:
          type: [integer, "null"]
          format: int64
        created_at:
          type: string
          format: date-time
    AdminAccount:
      type: object
      required: [telegram_id, full_name, is_active, created_at]
      properties:
        telegram_id:
          type: integer
          format: int64
        full_name:
          type: [string, "null"]
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
    CreateCompany:
      type: object
      required: [name, end_date, owner_phone, owner_full_name]
      properties:
        name:
          type: string
          minLength: 1
        end_date:
          type: string
          format: date
        owner_phone:
          type: string
          description: "+998 90 123 45 67, 998901234567 yoki 901234567"
        owner_full_name:
          type: string
          minLength: 1
    PatchCompany:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        is_active:
          type: boolean
    MemberInput:
      type: object
      required: [phone, full_name]
      properties:
        phone:
          type: string
          description: "+998 90 123 45 67, 998901234567 yoki 901234567"
        full_name:
          type: string
          minLength: 1
          description: Shu kompaniyadagi ismi
    RenameMember:
      type: object
      required: [full_name]
      properties:
        full_name:
          type: string
          minLength: 1
          description: Shu kompaniyadagi yangi ismi
    CreateBilling:
      type: object
      required: [days]
      properties:
        days:
          type: integer
          minimum: 1
          maximum: 3650
        amount:
          type: string
          pattern: "^[0-9]{1,12}([.][0-9]{1,2})?$"
        note:
          type: string
    AddAdmin:
      type: object
      required: [telegram_id, full_name]
      properties:
        telegram_id:
          type: integer
          format: int64
          minimum: 1
        full_name:
          type: string
          minLength: 1
    CodeSent:
      type: object
      required: [retry_after]
      properties:
        retry_after:
          type: integer
          description: Keyingi kodni necha soniyadan keyin so'rash mumkin
    Tokens:
      type: object
      required: [access_token, expires_in, company_id]
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          description: Soniyalarda (900)
        company_id:
          type: [integer, "null"]
          format: int64
          description: Tanlanmagan bo'lsa null (frontend /select-company'ga o'tadi)
    AppUser:
      type: object
      required: [phone, full_name]
      properties:
        phone:
          type: string
        full_name:
          type: [string, "null"]
          description: >
            Tanlangan kompaniyadagi ismi. Kompaniya tanlanmagan yoki a'zolikda
            ism bo'lmasa, userning o'z ismi.
    AppCompany:
      type: object
      required: [id, name, role, end_date, days_left, is_active]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        end_date:
          type: string
          format: date
        days_left:
          type: integer
          description: >
            end_date - bugun (baza sanasi). Muddati o'tgan bo'lsa manfiy:
            bunday company bilan so'rovlar 402 oladi.
        is_active:
          type: boolean
    Me:
      type: object
      required: [user, company, companies]
      properties:
        user:
          $ref: "#/components/schemas/AppUser"
        company:
          oneOf:
            - $ref: "#/components/schemas/AppCompany"
            - type: "null"
        companies:
          type: array
          items:
            $ref: "#/components/schemas/AppCompany"
    CustomerOption:
      type: object
      required: [id, label, is_active]
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
        is_active:
          type: boolean
          description: >
            Nofaol variant yangi tanlovlarda chiqmaydi, uni tanlagan
            mijozlarda qoladi
    CustomerDropdown:
      type: object
      required: [id, name, options]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        options:
          type: array
          description: Variantlar o'z tartibida
          items:
            $ref: "#/components/schemas/CustomerOption"
    CustomerFieldKind:
      type: string
      description: >
        string: matn; int: butun son; dropdown va radio: variantlardan
        bittasi; multi_dropdown va checkbox: variantlardan bir nechtasi
      enum: [string, int, dropdown, multi_dropdown, radio, checkbox]
    CustomerField:
      type: object
      required: [id, label, kind, required, is_unique, dropdown_id]
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
        kind:
          $ref: "#/components/schemas/CustomerFieldKind"
        required:
          type: boolean
        is_unique:
          type: boolean
          description: Faol mijozlar ichida qiymat takrorlanmaydi (faqat matn va son)
        dropdown_id:
          type: [integer, "null"]
          format: int64
          description: Tanlov turlarida variantlar olinadigan dropdown
    CustomerType:
      type: object
      required: [id, name, fields]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        fields:
          type: array
          description: Maydonlar o'z tartibida; birinchi matn maydoni mijoz nomi
          items:
            $ref: "#/components/schemas/CustomerField"
    NameInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 60
    OptionInput:
      type: object
      required: [label]
      properties:
        label:
          type: string
          maxLength: 60
    OptionPatch:
      type: object
      properties:
        label:
          type: string
          maxLength: 60
        is_active:
          type: boolean
    FieldInput:
      type: object
      required: [label, kind]
      properties:
        label:
          type: string
          maxLength: 60
        kind:
          $ref: "#/components/schemas/CustomerFieldKind"
        required:
          type: boolean
          default: false
        is_unique:
          type: boolean
          default: false
        dropdown_id:
          type: [integer, "null"]
          format: int64
          description: Tanlov turlarida majburiy, matn va sonda bo'lmaydi
    FieldPatch:
      type: object
      properties:
        label:
          type: string
          maxLength: 60
        required:
          type: boolean
        is_unique:
          type: boolean
    OrderInput:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          description: Hamma yozuvning ID'si, yangi tartibda, har biri bir marta
          items:
            type: integer
            format: int64
