  /app/customers:
    post:
      operationId: createCustomer
      summary: Mijoz qo'shish
      description: >
        Access token'dagi kompaniyaga mijoz qo'shadi; har a'zo qo'sha oladi.
        Telefon har doim majburiy: faqat O'zbekiston raqami, kompaniyaning
        faol mijozlari ichida takrorlanmaydi. values tanlangan turning
        maydonlariga javoblar; tekshiruv maydonlar tartibida, birinchi xato
        qaytadi (400 validation_error). Takror telefon (phone_taken) va
        takrorlanmas maydondagi takror javob (value_taken) 409 qaytaradi,
        javobda o'sha mijozning ID'si bilan. Kim qo'shgani saqlanadi.
      security:
        - appBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerCreate"
      responses:
        "201":
          description: Qo'shilgan mijoz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/SubscriptionExpired"
        "403":
          $ref: "#/components/responses/CompanyRequired"
        "409":
          $ref: "#/components/responses/CustomerTaken"
    get:
      operationId: listCustomers
      summary: Mijozlar ro'yxati
      description: >
        Access token'dagi kompaniyaning mijozlari, eng yangisi birinchi,
        sahifada 20 ta. Har a'zo o'qiydi. O'chirilgan mijozlar chiqmaydi.
      security:
        - appBearer: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: >
            Matn javoblarida qidiriladi (katta-kichik harf farqsiz,
            harfma-harf). Faqat raqamlardan iborat qidiruv (bo'shliq, +, -,
            qavs bilan yozilgan bo'lishi mumkin) telefonlarda va butun son
            javoblarida ham qidiriladi. Variant nomi bo'yicha qidirilmaydi.
        - name: type_id
          in: query
          schema:
            type: integer
            format: int64
          description: Faqat shu turdagi mijozlar
        - name: phone
          in: query
          schema:
            type: string
            pattern: "^[0-9]{1,9}$"
          description: >
            Telefoni 998 va shu raqamlar bilan boshlanadigan mijozlar (vazifa
            formasidagi mijoz takliflari). Boshqa belgi 400 beradi.
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: Mijozlar sahifasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/SubscriptionExpired"
        "403":
          $ref: "#/components/responses/CompanyRequired"
  /app/customers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getCustomer
      summary: Mijoz
      description: >
        Access token'dagi kompaniyaning mijozi, javoblari bilan. Har a'zo
        o'qiydi. O'chirilgan va boshqa kompaniyaning mijozi: 404.
      security:
