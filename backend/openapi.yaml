          type: string
          minLength: 1
        end_date:
          type: string
          format: date
        owner_phone:
          type: string
          description: "+998 90 123 45 67, 998901234567 yoki 901234567"
        owner_full_name:
          type: string
          minLength: 1
    PatchCompany:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        is_active:
          type: boolean
    MemberInput:
      type: object
      required: [phone, full_name]
      properties:
        phone:
